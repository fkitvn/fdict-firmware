name: OTA prod

# push nhanh prod -> build ban app (ESP-IDF 6.1, esp32s3) -> dang ban OTA kenh stable.
# URL may chu: Actions variable hoac secret DICT_API_URL; token: secret CI_RELEASE_TOKEN (environment production).
# Khong ghi vao repo/log.

on:
  push:
    branches:
      - prod

concurrency:
  group: ota-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ota:
    runs-on: ubuntu-latest
    environment: production
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v5

      # DICT_API_URL co the la variable (khong tu che): che + chuan hoa -> DICT_BASE (https://host) cho cac buoc sau
      - name: Mask server URL
        shell: bash
        env:
          DICT_API_URL: ${{ vars.DICT_API_URL || secrets.DICT_API_URL }}
        run: bash scripts/ci-url-normalize.sh

      - name: Build app firmware
        run: bash scripts/ci-ota-build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdict-ota-${{ env.BUILD_ID }}
          path: |
            ${{ env.OTA_BIN }}
            ${{ env.FULL_BIN }}
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish OTA
        shell: bash
        env:
          CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # DICT_BASE do buoc Mask tao (da che, https://host)
          API="${DICT_BASE:-}"
          [[ "$API" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "::error::DICT_BASE trong/khong hop le (xem buoc Mask server URL)"; exit 1; }
          test -f "${OTA_BIN:?}"
          case "$OTA_BIN" in *-full.bin) echo "::error::Cam day -full.bin len OTA"; exit 1 ;; esac
          HW=fnk0104b
          [[ "$HW" =~ ^[a-z0-9]{3,32}$ ]]
          [[ "${FW_VERSION:?}" =~ ^FDICT-([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::fw_version sai: $FW_VERSION"; exit 1; }
          [[ "${BUILD_ID:?}" =~ ^fdictdm[0-9]{2}[0-9a-f]{4}$ ]] || { echo "::error::build_id sai: $BUILD_ID"; exit 1; }
          SIZE="$(stat -c%s "$OTA_BIN")"
          test "$SIZE" -lt 4194304 || { echo "::error::bin >= 4 MB"; exit 1; }
          SHA256="$(sha256sum "$OTA_BIN" | awk '{print tolower($1)}')"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          NOTES="${NOTES_VI:-Cập nhật firmware}"
          echo "fw_version=$FW_VERSION build_id=$BUILD_ID size=$SIZE sha256=$SHA256"

          # token chi nam trong file header tam (khong o dong lenh, khong in ra)
          HDR="$(mktemp)"; RESP="$(mktemp)"
          trap 'rm -f "$HDR" "$RESP"' EXIT
          printf 'X-CI-Token: %s\n' "$CI_RELEASE_TOKEN" > "$HDR"

          # Chi thu lai khi loi mang (khong co HTTP status, 000) hoac HTTP 5xx/429.
          # 4xx khac (400/401/403/409/413...) dung ngay; 409 cung sha256 = da dang (thanh cong).
          ATTEMPTS=5
          CODE=000
          RC=0
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            CODE="$(curl --silent --show-error --http1.1 \
              --connect-timeout 20 --max-time 600 \
              -o "$RESP" -w '%{http_code}' \
              -X POST "$API/api/admin/releases" \
              -H @"$HDR" \
              -F "file=@$OTA_BIN;type=application/octet-stream" \
              -F "hw=$HW" \
              -F "fw_version=$FW_VERSION" \
              -F "build_id=$BUILD_ID" \
              -F "sha256=$SHA256" \
              -F "channel=stable" \
              -F "rollout_percent=100" \
              -F "git_sha=$GITHUB_SHA" \
              -F "pipeline_id=$GITHUB_RUN_ID" \
              -F "notes=$NOTES")"
            RC=$?
            set -e
            CODE="${CODE:-000}"
            echo "Lan $i/$ATTEMPTS: HTTP $CODE (curl rc=$RC)"
            if [[ "$CODE" == "000" || "$CODE" == "429" || "$CODE" =~ ^5[0-9]{2}$ ]]; then
              if [[ "$i" -lt "$ATTEMPTS" ]]; then
                DELAY=$((8 * i))
                echo "Loi tam thoi - thu lai sau ${DELAY}s"
                sleep "$DELAY"
                continue
              fi
            fi
            break
          done
          echo "HTTP $CODE (curl rc=$RC)"

          # in phan hoi (chi cac truong khong nhay cam) + quyet dinh ket qua
          python3 - "$RESP" "$CODE" "$SHA256" <<'PY' > result.env
          import json, sys
          path, code, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          raw = open(path, "rb").read().decode("utf-8", "replace")
          try:
              j = json.loads(raw) if raw.strip() else {}
          except ValueError:
              j = {"raw": raw[:300]}
          def strip(o):
              if isinstance(o, dict):
                  return {k: strip(v) for k, v in o.items()
                          if not any(s in k.lower() for s in ("token", "secret", "auth", "password", "url"))}
              if isinstance(o, list):
                  return [strip(x) for x in o]
              return o
          safe = strip(j)
          print(json.dumps(safe, ensure_ascii=False, indent=2), file=sys.stderr)
          def find(o, k):
              if isinstance(o, dict):
                  if k in o: return o[k]
                  for v in o.values():
                      r = find(v, k)
                      if r is not None: return r
              return None
          rel = find(j, "release_id") or find(j, "id") or ""
          import re
          rel = str(rel) if re.fullmatch(r"rel_[0-9a-f]{24}", str(rel)) else ""
          rsha = str(find(j, "sha256") or "").lower()
          if code == "201":
              state = "published"
          elif code == "409" and not rel:
              state = "exists_no_id"
          elif code == "409" and rsha == sha:
              state = "exists_same_sha"
          elif code == "409":
              state = "exists_conflict"
          else:
              state = "error"
          print("RELEASE_ID=%s" % rel)
          print("PUBLISH_STATE=%s" % state)
          PY
          # shellcheck disable=SC1091
          . ./result.env
          rm -f result.env
          # release_id cho buoc tai -full.bin (chi khi dung dinh dang, khong tu dat)
          if [[ "$RELEASE_ID" =~ ^rel_[0-9a-f]{24}$ ]]; then echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"; fi
          echo "PUBLISH_STATE=$PUBLISH_STATE" >> "$GITHUB_ENV"

          {
            echo "## OTA prod"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| fw_version | \`$FW_VERSION\` |"
            echo "| build_id | \`$BUILD_ID\` |"
            echo "| size | $SIZE B |"
            echo "| sha256 | \`$SHA256\` |"
            echo "| release_id | \`${RELEASE_ID:--}\` |"
            echo "| ket qua | $PUBLISH_STATE (HTTP $CODE) |"
            echo "| notes | $NOTES |"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$PUBLISH_STATE" in
            published) echo "Da dang ban $FW_VERSION ($BUILD_ID), release_id=${RELEASE_ID:--}" ;;
            exists_same_sha) echo "::notice::Ban $FW_VERSION da dang truoc do (cung sha256) - khong ghi de" ;;
            exists_no_id) echo "::error::409: ban $FW_VERSION/$BUILD_ID da ton tai nhung phan hoi khong co release_id - khong the gan -full.bin (tang PROJECT_VER va them muc CHANGELOG)"; exit 1 ;;
            exists_conflict) echo "::error::409: $FW_VERSION/$BUILD_ID da ton tai voi sha256 KHAC - tang PROJECT_VER va them muc CHANGELOG"; exit 1 ;;
            *) echo "::error::Dang ban that bai (HTTP $CODE)"; exit 1 ;;
          esac

      # Anh day du cua CUNG ban build (cho web USB flasher), gan vao release vua dang
      - name: Upload full image
        shell: bash
        env:
          CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          API="${DICT_BASE:-}"
          [[ "$API" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "::error::DICT_BASE trong/khong hop le"; exit 1; }
          test -f "${FULL_BIN:?}"
          [[ "${FULL_SHA256:?}" =~ ^[0-9a-f]{64}$ ]]
          FSIZE="$(stat -c%s "$FULL_BIN")"
          test "$FSIZE" -le 16777216 || { echo "::error::-full.bin > 16 MB"; exit 1; }
          FSHA="$(sha256sum "$FULL_BIN" | awk '{print tolower($1)}')"
          [[ "$FSHA" == "$FULL_SHA256" ]] || { echo "::error::sha256 -full.bin thay doi sau build"; exit 1; }
          REL="${RELEASE_ID:-}"
          if [[ ! "$REL" =~ ^rel_[0-9a-f]{24}$ ]]; then
            echo "::error::Khong co release_id hop le tu buoc Publish OTA"; exit 1
          fi
          echo "full: $(basename "$FULL_BIN") size=$FSIZE sha256=$FSHA release_id=$REL"

          HDR="$(mktemp)"; RESP="$(mktemp)"
          trap 'rm -f "$HDR" "$RESP"' EXIT
          printf 'X-CI-Token: %s\n' "$CI_RELEASE_TOKEN" > "$HDR"

          ATTEMPTS=5
          CODE=000
          RC=0
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            CODE="$(curl --silent --show-error --http1.1 \
              --connect-timeout 20 --max-time 900 \
              -o "$RESP" -w '%{http_code}' \
              -X POST "$API/api/admin/releases/full" \
              -H @"$HDR" \
              -F "release_id=$REL" \
              -F "file=@$FULL_BIN;type=application/octet-stream")"
            RC=$?
            set -e
            CODE="${CODE:-000}"
            echo "Full lan $i/$ATTEMPTS: HTTP $CODE (curl rc=$RC)"
            if [[ "$CODE" == "000" || "$CODE" == "429" || "$CODE" =~ ^5[0-9]{2}$ ]]; then
              if [[ "$i" -lt "$ATTEMPTS" ]]; then
                DELAY=$((8 * i))
                echo "Loi tam thoi - thu lai sau ${DELAY}s"
                sleep "$DELAY"
                continue
              fi
            fi
            break
          done

          if [[ "$CODE" == "413" ]]; then
            echo "::error::HTTP 413: nginx chan file lon - can 'location = /api/admin/releases/full { client_max_body_size 20m; }'"
            exit 1
          fi
          RSHA="$(python3 - "$RESP" <<'PY'
          import json, sys
          try:
              j = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              j = {}
          r = j.get("release") if isinstance(j, dict) else None
          print(str((r or {}).get("full_sha256") or "").lower())
          if not r and isinstance(j, dict) and j.get("error"):
              print("error=%s" % str(j["error"])[:80], file=sys.stderr)
          PY
          )"
          {
            echo "| full_size | $FSIZE B |"
            echo "| full_sha256 | \`$FSHA\` |"
            echo "| full upload | HTTP $CODE |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CODE" == "200" ]] || { echo "::error::Tai -full.bin that bai (HTTP $CODE)"; exit 1; }
          [[ "$RSHA" == "$FSHA" ]] || { echo "::error::full_sha256 server ($RSHA) != local ($FSHA)"; exit 1; }
          echo "Da tai -full.bin cho $REL: full_sha256=$RSHA (khop)"
